<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Swati Publications</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #525659;
        }

        #viewer {
            width: 100%;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: auto;

            padding: 10px;
        }

        #page-container {
            position: relative;

            background: white;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.35);

            flex-shrink: 0;
        }

        #pdf-canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        /*
         * PDF links
         */
        #annotation-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
        }

        #annotation-layer a {
            position: absolute;

            display: block;

            pointer-events: auto;

            cursor: pointer;

            text-decoration: none;
        }

        #annotation-layer a:hover {
            background: rgba(0, 120, 255, 0.10);
        }
    </style>
</head>

<body>

<div id="viewer">

    <div id="page-container">

        <canvas id="pdf-canvas"></canvas>

        <div id="annotation-layer"></div>

    </div>

</div>


<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

    /*
     * ==========================================
     * YOUR PDF
     * ==========================================
     */

    const PDF_PATH = "swati_11aug.pdf";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    const viewer =
        document.getElementById("viewer");

    const container =
        document.getElementById("page-container");

    const canvas =
        document.getElementById("pdf-canvas");

    const ctx =
        canvas.getContext("2d", {
            alpha: false
        });

    const annotationLayer =
        document.getElementById("annotation-layer");


    let pdfDocument = null;


    /*
     * ==========================================
     * LOAD PDF ONCE
     * ==========================================
     */

    async function loadPDF() {

        pdfDocument =
            await pdfjsLib
                .getDocument(PDF_PATH)
                .promise;

        renderPage();
    }


    /*
     * ==========================================
     * RENDER PAGE
     * ==========================================
     */

    async function renderPage() {

        if (!pdfDocument)
            return;


        const page =
            await pdfDocument.getPage(1);


        /*
         * Original PDF dimensions
         */

        const baseViewport =
            page.getViewport({
                scale: 1
            });


        /*
         * Available screen size
         */

        const availableWidth =
            viewer.clientWidth - 20;

        const availableHeight =
            viewer.clientHeight - 20;


        /*
         * Calculate scale required
         * to fit width.
         */

        const widthScale =
            availableWidth /
            baseViewport.width;


        /*
         * Calculate scale required
         * to fit height.
         */

        const heightScale =
            availableHeight /
            baseViewport.height;


        /*
         * IMPORTANT
         *
         * This determines the DISPLAY size.
         *
         * The smaller scale ensures that
         * the entire page fits.
         */

        const displayScale =
            Math.min(
                widthScale,
                heightScale
            );


        /*
         * ==========================================
         * HIGH DPI RENDERING
         * ==========================================
         *
         * devicePixelRatio:
         *
         * Normal monitor  -> 1
         * Retina          -> 2
         * High DPI        -> 2 / 3
         * 4K display      -> potentially 2+
         *
         */

        const devicePixelRatio =
            Math.min(
                window.devicePixelRatio || 1,
                3
            );


        /*
         * PDF viewport used for DISPLAY
         */

        const displayViewport =
            page.getViewport({
                scale: displayScale
            });


        /*
         * PDF viewport used for RENDERING
         *
         * We render at a much higher resolution
         * than the actual display size.
         */

        const renderViewport =
            page.getViewport({
                scale:
                    displayScale *
                    devicePixelRatio
            });


        /*
         * ==========================================
         * CONTAINER SIZE
         * ==========================================
         */

        container.style.width =
            displayViewport.width + "px";

        container.style.height =
            displayViewport.height + "px";


        /*
         * ==========================================
         * CANVAS RESOLUTION
         * ==========================================
         *
         * Physical pixels are higher than
         * CSS pixels.
         */

        canvas.width =
            Math.ceil(
                renderViewport.width
            );

        canvas.height =
            Math.ceil(
                renderViewport.height
            );


        /*
         * CSS display size remains normal.
         */

        canvas.style.width =
            displayViewport.width + "px";

        canvas.style.height =
            displayViewport.height + "px";


        /*
         * Clear previous rendering
         */

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * ==========================================
         * RENDER HIGH QUALITY PDF
         * ==========================================
         */

        await page.render({

            canvasContext: ctx,

            viewport: renderViewport

        }).promise;


        /*
         * ==========================================
         * RENDER PDF LINKS
         * ==========================================
         */

        await renderAnnotations(
            page,
            displayViewport
        );
    }


    /*
     * ==========================================
     * PDF LINK ANNOTATIONS
     * ==========================================
     */

    async function renderAnnotations(
        page,
        viewport
    ) {

        const annotations =
            await page.getAnnotations();


        annotationLayer.innerHTML = "";


        for (
            const annotation
            of annotations
        ) {

            if (
                annotation.subtype !==
                "Link"
            ) {
                continue;
            }


            /*
             * PDF coordinates → screen coordinates
             */

            const rect =
                annotation.rect;


            const viewRect =
                viewport.convertToViewportRectangle(
                    rect
                );


            const left =
                Math.min(
                    viewRect[0],
                    viewRect[2]
                );

            const top =
                Math.min(
                    viewRect[1],
                    viewRect[3]
                );

            const width =
                Math.abs(
                    viewRect[2] -
                    viewRect[0]
                );

            const height =
                Math.abs(
                    viewRect[3] -
                    viewRect[1]
                );


            /*
             * Create clickable link
             */

            const link =
                document.createElement("a");


            link.style.left =
                left + "px";

            link.style.top =
                top + "px";

            link.style.width =
                width + "px";

            link.style.height =
                height + "px";


            /*
             * External URL
             */

            if (annotation.url) {

                link.href =
                    annotation.url;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";
            }


            /*
             * Internal PDF destination
             */

            else if (annotation.dest) {

                link.href = "#";

                link.addEventListener(
                    "click",
                    async function(event) {

                        event.preventDefault();

                        console.log(
                            "Internal PDF destination:",
                            annotation.dest
                        );

                    }
                );
            }


            annotationLayer
                .appendChild(link);
        }
    }


    /*
     * ==========================================
     * RESIZE HANDLING
     * ==========================================
     */

    let resizeTimer = null;


    window.addEventListener(
        "resize",
        function() {

            clearTimeout(
                resizeTimer
            );

            resizeTimer =
                setTimeout(
                    renderPage,
                    200
                );
        }
    );


    /*
     * ==========================================
     * START
     * ==========================================
     */

    loadPDF();

</script>

</body>
</html>
