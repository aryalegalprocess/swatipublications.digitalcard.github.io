<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Swati Publications</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #525659;
        }

        #viewer {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

<div id="viewer">
    <canvas id="pdfCanvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

    // ============================
    // PUT YOUR PDF PATH HERE
    // ============================
    const PDF_PATH = "swati_11aug.pdf";


    const viewer = document.getElementById("viewer");
    const canvas = document.getElementById("pdfCanvas");
    const context = canvas.getContext("2d");

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    async function loadPDF() {

        const pdf = await pdfjsLib.getDocument(PDF_PATH).promise;

        // Display first page
        const page = await pdf.getPage(1);

        const originalViewport = page.getViewport({
            scale: 1
        });

        // Available screen dimensions
        const availableWidth =
            viewer.clientWidth - 20;

        const availableHeight =
            viewer.clientHeight - 20;


        // Calculate scale required for width
        const widthScale =
            availableWidth / originalViewport.width;


        // Calculate scale required for height
        const heightScale =
            availableHeight / originalViewport.height;


        // Choose the smaller scale.
        // This guarantees BOTH width and height fit.
        const scale =
            Math.min(widthScale, heightScale);


        const viewport = page.getViewport({
            scale: scale
        });


        canvas.width = viewport.width;
        canvas.height = viewport.height;


        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;
    }


    loadPDF();


    // Recalculate when screen size changes
    window.addEventListener("resize", () => {
        loadPDF();
    });

</script>

</body>
</html>
