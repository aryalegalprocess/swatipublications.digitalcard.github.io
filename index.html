<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .pdf-container {
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Better support for mobile browser UI */
        }

        .pdf-viewer {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="pdf-container">
        <iframe
            class="pdf-viewer"
            src="swati_11aug.pdf"
            title="PDF Viewer">
        </iframe>
    </div>

</body>
</html>
